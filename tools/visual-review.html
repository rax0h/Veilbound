<!doctype html><html lang="en"><meta charset="utf-8"><title>Riverford viewport review</title>
<style>body{margin:0;background:#242827;color:#eee;font:14px sans-serif}header{padding:10px;display:flex;gap:12px;align-items:center}button,select{padding:8px}iframe{border:0;display:block;margin:0 auto;background:#111}#stage{overflow:auto}</style>
<header><label>Viewport <select id="size"><option value="390,844">Phone portrait · 390 × 844</option><option value="844,390">Phone landscape · 844 × 390</option><option value="1280,800">Desktop · 1280 × 800</option></select></label><label>Build <select id="build"><option value="/?review=1">Local</option><option value="https://rax0h.github.io/Veilbound/?review=1">Deployed Pages</option></select></label><button id="load">Load build</button></header>
<div id="stage"><iframe id="review" title="Playable viewport" width="390" height="844" src="/?review=1"></iframe></div>
<script>const view=document.querySelector('#review');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');view.width=w;view.height=h};document.querySelector('#load').onclick=()=>view.src=document.querySelector('#build').value;</script></html>
