name: Gold Standard Slice

on:
  pull_request:
  push:
    branches: [codex/build-playable-gold-standard-slice]

jobs:
  verify-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify playable slice
        run: npm run verify:slice
      - name: Ensure generated artwork remains ephemeral
        run: test -z "$(git status --short --untracked-files=all .runtime assets | grep -E '\.(png|jpg|jpeg|webp)$' || true)"
