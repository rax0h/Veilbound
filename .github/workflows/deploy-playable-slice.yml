name: Deploy Veilbound playable slice

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize transparent Gold Standard assets
        run: npm run assets:materialize

      - name: Verify playable slice
        run: |
          npm run check:slice
          npm test
          npm run verify

      - name: Assemble browser build
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R src _site/src
          for dir in atmosphere characters creatures environment props ui; do
            if [ -d "assets/$dir" ]; then
              cp -R "assets/$dir" "_site/assets/$dir"
            fi
          done
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('_site/build.json', JSON.stringify({commit:process.env.GITHUB_SHA,scene:'riverford-verge'}));"
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload playable slice
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
